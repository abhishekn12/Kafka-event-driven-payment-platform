global:
  scrape_interval: 15s      # scrape every service every 15 seconds
  evaluation_interval: 15s

scrape_configs:

  # Prometheus scrapes itself (useful for debugging)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape all 4 Spring Boot services
  # Each exposes metrics at /actuator/prometheus
  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']   # host.docker.internal = your laptop from inside Docker

  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']

  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']

  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8084']