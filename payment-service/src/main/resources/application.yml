server:
  port: 8082

spring:
  application:
    name: payment-service

  # DB_HOST/KAFKA_BOOTSTRAP_SERVERS/REDIS_HOST default to localhost for
  # `mvn spring-boot:run` local dev; docker-compose overrides them to the
  # container service names so this same jar/image works both ways.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/paymentdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # StringSerializer — this KafkaTemplate is used by DeadLetterPublishingRecoverer
      # to republish the original (already-String) record value to the DLQ topic.
      # JsonSerializer would double-encode it, same bug as order-service's producer.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: payment-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # StringDeserializer, not JsonDeserializer — order-service publishes a raw JSON
      # string (no __TypeId__ header), so we deserialize manually in the listener.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

  # Redis for idempotency keys
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# See order-service/application.yml for why — same MDC-based correlation ID convention
# across all four services.
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %5p [%thread] orderId=%X{orderId:-} %-40.40logger{39} : %m%n"