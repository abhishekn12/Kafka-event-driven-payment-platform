server:
  port: 8084

spring:
  application:
    name: notification-service

  # KAFKA_BOOTSTRAP_SERVERS defaults to localhost:9092 for `mvn spring-boot:run`
  # local dev; docker-compose overrides it to the container service name.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # This service never produced anything before — now needed so
    # DeadLetterPublishingRecoverer has a KafkaTemplate to publish to the DLQ topic.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: notification-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # StringDeserializer, not JsonDeserializer — order-service publishes a raw JSON
      # string (no __TypeId__ header), so we deserialize manually in the listener.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# See order-service/application.yml for why — same MDC-based correlation ID convention
# across all four services.
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %5p [%thread] orderId=%X{orderId:-} %-40.40logger{39} : %m%n"