server:
  port: 8081   # order-service runs on port 8081

spring:
  application:
    name: order-service

  # PostgreSQL connection
  # DB_HOST defaults to localhost for `mvn spring-boot:run` local dev; docker-compose
  # overrides it to the "postgres" service name so this same jar/image works both ways.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/orderdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # auto-creates tables on startup (use 'validate' in prod)
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Kafka connection
  # KAFKA_BOOTSTRAP_SERVERS defaults to localhost:9092 (the PLAINTEXT_HOST listener)
  # for local dev; docker-compose overrides it to kafka:29092 (the PLAINTEXT
  # internal listener) — see docker-compose.yml's kafka service for why there
  # are two listeners.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # StringSerializer, not JsonSerializer — OutboxPoller already hands us a JSON string
      # (serialized once via ObjectMapper in OrderService). JsonSerializer would re-encode
      # that string, double-wrapping it in quotes on the wire.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: order-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # StringDeserializer, not JsonDeserializer — payment/inventory-service publish raw
      # JSON strings (no __TypeId__ header), so we deserialize manually in each listener.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest   # if no offset saved, start from beginning of topic

# Expose all actuator endpoints (health, metrics, prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# %X{orderId:-} pulls the correlation ID set via MDC in every listener/service method —
# every log line touched by processing an order carries it, not just the ones that
# explicitly interpolate orderId into the message text (includes framework logs like
# Hibernate SQL). The :- suffix prints blank instead of "null" when no order is in context
# (e.g. startup logs).
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %5p [%thread] orderId=%X{orderId:-} %-40.40logger{39} : %m%n"