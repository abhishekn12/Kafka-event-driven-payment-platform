server:
  port: 8081   # order-service runs on port 8081

spring:
  application:
    name: order-service

  # PostgreSQL connection
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # auto-creates tables on startup (use 'validate' in prod)
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Kafka connection
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # StringSerializer, not JsonSerializer — OutboxPoller already hands us a JSON string
      # (serialized once via ObjectMapper in OrderService). JsonSerializer would re-encode
      # that string, double-wrapping it in quotes on the wire.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: order-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # StringDeserializer, not JsonDeserializer — payment/inventory-service publish raw
      # JSON strings (no __TypeId__ header), so we deserialize manually in each listener.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest   # if no offset saved, start from beginning of topic

# Expose all actuator endpoints (health, metrics, prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true